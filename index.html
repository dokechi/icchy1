@media (prefers-reduced-motion:no-preference){
  @keyframes taste-enter{
    from{
      opacity:0;
      transform:translateY(7px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }
  main>.page>*,
  .home-intro,
  .home-card{
    animation:taste-enter .36s cubic-bezier(.16,1,.3,1) both;
  }
  main>.page>*:nth-child(2),
  .home-card:nth-child(2){
    animation-delay:.035s;
  }
  main>.page>*:nth-child(3),
  .home-card:nth-child(3){
    animation-delay:.07s;
  }
  main>.page>*:nth-child(4),
  .home-card:nth-child(4){
    animation-delay:.105s;
  }
  main>.page>*:nth-child(n/**/+5){
    animation-delay:.14s;
  }
}

@media (prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

.compare-main small,
.compare-truth span,
.money small,
.fact span,
.warning,
.account-bottom > small,
.broker-links small,
.compact-priority-list small,
.insurance-compact-check small,
.insurance-step-link small,
.manager-mini-grid span,
.notice,
.small{
  line-height:1.52;
}

.primary,
.secondary,
.detail-toggle,
.choice-tabs button,
.chip,
.insurance-copy-link,
.insurance-small-details summary,
.back-link,
.broker-links strong{
  line-height:1.4;
}

.journal-card{
  padding:17px 0;
}

.insurance-compact-check li{
  padding:12px 0;
}

.insurance-step-link{
  min-height:72px;
}

.compare-row{
  min-height:72px;
}

html,
body,
.site,
main,
.page{
  max-width:100%;
  min-width:0;
}

body{
  overflow-x:hidden;
}

.yutai-month-filter{
  min-width:0;
}

.yutai-month-filter .chips{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
  width:100%;
  margin-top:10px;
  padding:0;
  overflow:visible;
}

.yutai-month-filter .chip{
  width:100%;
  min-width:0;
  min-height:44px;
  padding:0 4px;
  justify-content:center;
  white-space:nowrap;
}

@media (max-width:340px){
  .yutai-month-filter .chips{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

.story-hero{
  padding:6px 0 20px;
  border-bottom:1px solid var(--line);
}

.story-hero h1{
  margin:0;
  line-height:1.02;
  letter-spacing:-.06em;
}

.story-hero p{
  max-width:31rem;
  margin:12px 0 0;
  line-height:1.65;
  color:#39414a;
}

.visual-section,
.premium-ladder,
.priority-visual,
.coverage-gap-section{
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.visual-copy h2{
  margin:0;
  line-height:1.38;
}

.visual-copy p{
  margin:8px 0 0;
  line-height:1.65;
  color:#4c5560;
}

.section-kicker{
  margin:0 0 6px !important;
  color:var(--page-accent) !important;
  font-weight:850 !important;
}

.short-conclusion{
  font-weight:850 !important;
  color:var(--ink) !important;
}

.tethering-story{
  display:grid;
  gap:20px;
}

.tether-diagram{
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  background:var(--surface-raised);
}

.tether-source{
  width:min(230px,100%);
  margin:auto;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:2px solid var(--page-accent);
  border-radius:var(--radius-control);
  background:var(--page-accent-soft);
}

.tether-source span{
  font-weight:900;
}

.tether-source strong{
  color:var(--page-accent);
  line-height:1.25;
  text-align:right;
}

.tether-line{
  position:relative;
  height:36px;
}

.tether-line::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:1px;
  height:22px;
  background:var(--page-accent);
}

.tether-line::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  top:21px;
  height:1px;
  background:var(--page-accent);
}

.tether-line span::before,
.tether-line span::after{
  content:"";
  position:absolute;
  top:21px;
  width:1px;
  height:15px;
  background:var(--page-accent);
}

.tether-line span::before{
  left:20%;
}

.tether-line span::after{
  right:20%;
}

.tether-targets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.tether-targets div{
  padding:14px 10px;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  background:var(--paper);
  text-align:center;
}

.tether-targets strong{
  display:block;
}

.tether-targets small{
  display:block;
  margin-top:3px;
  color:var(--muted);
}

.reality-check{
  display:grid;
  gap:12px;
}

.location-check,
.latency-note{
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  background:var(--surface-raised);
}

.location-check h2,
.latency-note h2{
  margin:0;
}

.location-check>p,
.latency-note p{
  margin:8px 0 0;
  line-height:1.65;
  color:#4b545e;
}

.location-rail{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:14px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
}

.location-rail div{
  padding:12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.location-rail div:nth-child(2n){
  border-right:0;
}

.location-rail div:nth-last-child(-n/**/+2){
  border-bottom:0;
}

.location-rail b{
  display:block;
  color:var(--page-accent);
}

.location-rail span{
  display:block;
  margin-top:2px;
  color:var(--muted);
}

.latency-note{
  border-left:4px solid var(--page-accent);
  background:var(--page-accent-soft);
}

.latency-note>span{
  color:var(--page-accent);
  font-weight:900;
}

.decision-cta{
  padding:18px;
  display:grid;
  gap:14px;
  border:1px solid color-mix(in srgb,var(--page-accent) 35%,var(--line));
  border-radius:var(--radius-card);
  background:var(--page-accent-soft);
}

.decision-cta span{
  color:var(--page-accent);
  font-weight:900;
}

.decision-cta h3{
  margin:5px 0 0;
}

.decision-cta p{
  margin:6px 0 0;
  color:#465049;
}

.article-feature{
  display:grid;
  overflow:hidden;
  border:1px solid color-mix(in srgb,var(--page-accent) 28%,var(--line));
  border-radius:var(--radius-card);
  background:var(--surface-raised);
  color:inherit;
  text-decoration:none;
  box-shadow:0 12px 30px rgb(30 58 47 / .08);
}

.article-feature:focus-visible{
  outline:3px solid color-mix(in srgb,var(--page-accent) 35%,transparent);
  outline-offset:3px;
}

.article-feature-image{
  aspect-ratio:12 / 5;
  overflow:hidden;
  background:var(--page-accent-soft);
}

.article-feature-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.article-feature-copy{
  padding:18px;
}

.article-feature-kicker,
.article-eyebrow{
  margin:0 0 6px;
  color:var(--page-accent);
  font-size:var(--type-label);
  font-weight:900;
  letter-spacing:.04em;
}

.article-feature h2{
  margin:0;
  font-size:var(--type-section);
  line-height:var(--leading-title);
  letter-spacing:-.025em;
}

.article-feature p:not(.article-feature-kicker){
  margin:8px 0 0;
  color:#4b555f;
  line-height:var(--leading-support);
}

.article-feature-action{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  color:var(--page-accent);
  font-weight:900;
}

.mobile-article-page{
  gap:0;
}

.article-header{
  padding:8px 0 20px;
}

.article-header h1{
  margin:0;
  font-size:clamp(34px,9vw,46px);
  line-height:1.18;
  letter-spacing:-.055em;
}

.article-description{
  margin:14px 0 0;
  color:#424b55;
  line-height:var(--leading-body);
}

.article-meta{
  margin:12px 0 0;
  color:var(--muted);
  font-size:var(--type-support);
  line-height:1.6;
}

.article-thumbnail{
  margin:0 calc(var(--side) * -1);
  background:var(--page-accent-soft);
}

.article-thumbnail img{
  width:100%;
  height:auto;
  display:block;
}

.article-body{
  display:grid;
}

.article-lead{
  margin:0;
  padding:24px 0;
  border-bottom:1px solid var(--line);
  font-size:var(--type-body);
  font-weight:700;
  line-height:var(--leading-body);
}

.article-section{
  padding:26px 0;
  border-bottom:1px solid var(--line);
}

.article-section h2{
  margin:0;
  font-size:var(--type-section);
  line-height:var(--leading-title);
  letter-spacing:-.035em;
}

.article-section p{
  margin:12px 0 0;
  line-height:var(--leading-body);
}

.article-section ul{
  margin:14px 0 0;
  padding-left:1.3em;
}

.article-section li{
  margin:7px 0;
  line-height:var(--leading-body);
}

.article-note{
  margin-top:18px;
  padding:14px 16px;
  border-left:4px solid var(--page-accent);
  background:var(--page-accent-soft);
  line-height:var(--leading-support);
}

.article-links{
  display:grid;
  gap:10px;
  margin-top:16px;
}

.article-links a{
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  background:#fff;
  color:var(--page-accent);
  font-weight:850;
  line-height:1.45;
  text-decoration:none;
}

.article-links a::after{
  content:"↗";
  flex:none;
}

.article-next{
  padding:24px 0 4px;
}

.article-next p{
  margin:0 0 10px;
  color:var(--muted);
  font-size:var(--type-support);
}

.article-next-nav{
  display:grid;
  gap:10px;
}

.article-next-nav a{
  min-height:56px;
  display:flex;
  align-items:center;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  color:var(--ink);
  font-weight:850;
  line-height:1.45;
  text-decoration:none;
}

.yutai-path{
  display:grid;
  grid-template-columns:1fr 20px 1fr 20px 1fr;
  align-items:center;
  gap:4px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  background:var(--surface-raised);
}

.yutai-path div{
  text-align:center;
}

.yutai-path div>span{
  width:26px;
  height:26px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--page-accent);
  color:white;
  font-weight:900;
}

.yutai-path strong{
  display:block;
  margin-top:6px;
}

.yutai-path small{
  display:block;
  margin-top:2px;
  color:var(--muted);
}

.yutai-path i{
  position:relative;
  height:1px;
  background:var(--line);
}

.yutai-path i::after{
  content:"";
  position:absolute;
  right:-1px;
  top:-3px;
  width:6px;
  height:6px;
  border-top:1px solid var(--muted);
  border-right:1px solid var(--muted);
  transform:rotate(45deg);
}

.ladder-track{
  display:grid;
  grid-template-columns:1fr 14px 1fr 14px 1fr 14px 1.08fr;
  align-items:stretch;
  gap:4px;
  margin-top:16px;
}

.ladder-track div{
  padding:13px 6px;
  display:grid;
  align-content:center;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  background:var(--surface-raised);
  text-align:center;
}

.ladder-track small{
  color:var(--muted);
}

.ladder-track strong{
  display:block;
  margin-top:3px;
}

.ladder-track i{
  align-self:center;
  position:relative;
  height:1px;
  background:var(--line);
}

.ladder-track i::after{
  content:"";
  position:absolute;
  right:0;
  top:-3px;
  width:6px;
  height:6px;
  border-top:1px solid var(--muted);
  border-right:1px solid var(--muted);
  transform:rotate(45deg);
}

.ladder-track .ladder-last{
  border-color:var(--page-accent);
  background:var(--page-accent-soft);
}

.ladder-track .ladder-last strong{
  color:var(--page-accent);
}

.priority-stack{
  display:grid;
  gap:7px;
  margin-top:16px;
}

.priority-band{
  min-height:62px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-radius:var(--radius-control);
  color:var(--ink);
}

.priority-band small{
  color:inherit;
  opacity:.72;
}

.priority-band strong{
  text-align:right;
}

.priority-one{
  width:100%;
  background:color-mix(in srgb,var(--page-accent) 18%,white);
}

.priority-two{
  width:88%;
  background:color-mix(in srgb,var(--page-accent) 11%,white);
}

.priority-three{
  width:72%;
  background:var(--paper);
  border:1px solid var(--line);
}

.context-note{
  margin:12px 0 0;
  line-height:1.55;
  color:var(--muted);
}

.coverage-gap{
  display:grid;
  grid-template-columns:1.2fr 22px 1fr 22px 1fr;
  align-items:center;
  gap:5px;
  margin-top:16px;
}

.coverage-sources{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
}

.coverage-sources span{
  padding:15px 5px;
  border-right:1px solid var(--line);
  background:var(--surface-raised);
  text-align:center;
  font-weight:850;
}

.coverage-sources span:last-child{
  border-right:0;
}

.coverage-gap>i{
  position:relative;
  height:1px;
  background:var(--line);
}

.coverage-gap>i::after{
  content:"";
  position:absolute;
  right:0;
  top:-3px;
  width:6px;
  height:6px;
  border-top:1px solid var(--muted);
  border-right:1px solid var(--muted);
  transform:rotate(45deg);
}

.coverage-gap-box,
.coverage-insurance{
  min-height:58px;
  padding:10px;
  display:grid;
  place-content:center;
  border-radius:var(--radius-control);
  text-align:center;
}

.coverage-gap-box{
  border:1px solid var(--page-accent);
  background:var(--page-accent-soft);
}

.coverage-gap-box small{
  color:var(--page-accent);
}

.coverage-gap-box strong{
  color:var(--page-accent);
}

.coverage-insurance{
  background:var(--page-accent);
  color:white;
}

.insurance-roadmap{
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.insurance-roadmap h2{
  margin:0;
}

.insurance-roadmap ol{
  position:relative;
  margin:16px 0 0;
  padding:0;
  list-style:none;
}

.insurance-roadmap ol::before{
  content:"";
  position:absolute;
  left:18px;
  top:20px;
  bottom:20px;
  width:1px;
  background:var(--line);
}

.insurance-roadmap li{
  position:relative;
  display:grid;
  grid-template-columns:38px minmax(0,1fr);
  gap:12px;
  padding:0 0 17px;
}

.insurance-roadmap li:last-child{
  padding-bottom:0;
}

.insurance-roadmap li>span{
  z-index:1;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--page-accent);
  color:white;
  font-weight:900;
}

.insurance-roadmap strong{
  display:block;
  line-height:1.45;
}

.insurance-roadmap small{
  display:block;
  margin-top:4px;
  line-height:1.5;
  color:var(--muted);
}

.insurance-actions-flow{
  display:grid;
  gap:10px;
}

.action-panel{
  position:relative;
  min-height:92px;
  padding:15px 48px 15px 15px;
  display:grid;
  align-content:center;
  border:1px solid var(--line);
  border-left:4px solid var(--page-accent);
  border-radius:var(--radius-card);
  background:var(--surface-raised);
  color:var(--ink);
  text-decoration:none;
}

.action-panel>span{
  color:var(--page-accent);
  font-weight:900;
}

.action-panel>strong{
  display:block;
  margin-top:5px;
  line-height:1.4;
}

.action-panel>small{
  display:block;
  margin-top:4px;
  line-height:1.5;
  color:var(--muted);
}

.action-panel>b{
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
}

.compare-panel{
  background:var(--page-accent-soft);
}

.news-skeleton{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.news-skeleton span{
  display:block;
  height:44px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,transparent 0 12%,var(--line-soft) 12% 64%,transparent 64%);
}

@media (min-width:720px){
  .tethering-story{
    grid-template-columns:1fr 1fr;
    align-items:center;
  }
  .reality-check{
    grid-template-columns:1.2fr .8fr;
  }
  .decision-cta{
    grid-template-columns:1fr minmax(230px,.8fr);
    align-items:center;
  }
}

@media (max-width:560px){
  .ladder-track{
    grid-template-columns:1fr 10px 1fr;
    row-gap:10px;
  }
  .ladder-track i:nth-of-type(2){
    display:none;
  }
  .ladder-track div:nth-of-type(3){
    grid-column:1;
  }
  .ladder-track i:nth-of-type(3){
    grid-column:2;
  }
  .ladder-track div:nth-of-type(4){
    grid-column:3;
  }
  .coverage-gap{
    grid-template-columns:1fr;
    gap:8px;
  }
  .coverage-gap>i{
    width:1px;
    height:18px;
    margin:auto;
  }
  .coverage-gap>i::after{
    right:-3px;
    top:auto;
    bottom:0;
    transform:rotate(135deg);
  }
  .priority-two{
    width:92%;
  }
  .priority-three{
    width:80%;
  }
}

@media (max-width:390px){
  .yutai-path{
    grid-template-columns:1fr 12px 1fr 12px 1fr;
    padding:12px 8px;
  }
}

/* ============================================================
   ICCHY DESIGN SYSTEM
   Reading: trust-first mobile editorial utility.
   DESIGN_VARIANCE: 4
   MOTION_INTENSITY: 3
   VISUAL_DENSITY: 4
   ============================================================ */

:root{
  --type-body:18px;
  --type-support:16px;
  --type-label:15px;
  --type-button:17px;
  --type-card-title:20px;
  --type-section:25px;
  --type-display:clamp(42px,11vw,48px);
  --type-money:24px;
  --type-compare-price:20px;

  --leading-body:1.74;
  --leading-support:1.65;
  --leading-title:1.38;
}

html.font-step-up{
  --type-body:20px;
  --type-support:18px;
  --type-label:17px;
  --type-button:19px;
  --type-card-title:22px;
  --type-section:28px;
  --type-display:clamp(46px,12vw,54px);
  --type-money:27px;
  --type-compare-price:23px;
}

html{
  font-size:18px;
  -webkit-text-size-adjust:100%;
}

body{
  color:#30363d;
  font-size:var(--type-body);
  font-weight:500;
  line-height:var(--leading-body);
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

.header{
  min-height:62px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.brand{
  font-size:19px;
}

.font-size-toggle{
  min-height:40px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-weight:850;
  line-height:1;
  white-space:nowrap;
  touch-action:manipulation;
}

.font-size-toggle[aria-pressed="true"]{
  border-color:var(--page-accent,var(--blue));
  background:var(--page-accent-soft,var(--blue-soft));
  color:var(--page-accent,var(--blue));
}

button,
a,
summary,
input{
  touch-action:manipulation;
}

.page-head h1,
.first-view h1,
.mobile-hero h1,
.story-hero h1,
.journal-hero h1,
.yutai-head h1,
.insurance-compact-hero h1,
.deals-title h1,
.home-screen h1{
  font-size:var(--type-display);
  line-height:1.06;
  letter-spacing:-.055em;
}

.section-title,
.visual-copy h2,
.location-check h2,
.latency-note h2,
.premium-ladder h2,
.priority-visual h2,
.coverage-gap-section h2,
.insurance-roadmap h2,
.journal-card h2,
.mobile-compare-v2 h2,
.journal-cta h3,
.decision-cta h3,
.insurance-compact-priority h2,
.insurance-compact-check h2,

/* ============================================================
   V59 UX refinement
   - Keep the four-choice home screen visible without scrolling.
   - Make entrance motion feel immediate.
   - Clarify hover, tap, pressed and keyboard states.
   - Improve long-form detail readability and large-text resilience.
   ============================================================ */

#app:focus{
  outline:none;
}

h1[tabindex="-1"]:focus{
  outline:none;
  box-shadow:none;
}

button,
[role="button"],
summary,
.home-card,
.action-panel,
.insurance-step-link,
.broker-links a{
  -webkit-tap-highlight-color:color-mix(in srgb,var(--page-accent) 18%,transparent);
}

button:disabled,
[aria-disabled="true"]{
  cursor:not-allowed;
  opacity:.58;
}

/* Faster entrance: content is effectively present at once, with only a small settling motion. */
@media(prefers-reduced-motion:no-preference){
  @keyframes icchy-enter-fast{
    from{
      opacity:.72;
      transform:translateY(3px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  main>.page>*,
  main>.page>*:nth-child(n),
  .home-intro,
  .home-card,
  .home-card:nth-child(n){
    animation:icchy-enter-fast .16s cubic-bezier(.2,.8,.2,1) backwards;
    animation-delay:0s;
  }
}

/* Clear hover and pressed feedback without making the interface feel jumpy. */
.primary,
.secondary,
.detail-toggle,
.chip,
.choice-tabs button,
.home-card,
.action-panel,
.insurance-step-link,
.broker-links a,
.font-size-toggle,
.back-home,
summary{
  transition:
    transform .12s ease,
    box-shadow .16s ease,
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease,
    opacity .16s ease;
}

@media(hover:hover) and (pointer:fine){
  .primary:hover,
  .secondary:hover,
  .detail-toggle:hover,
  .insurance-step-link:hover,
  .broker-links a:hover,
  .action-panel:hover{
    transform:translateY(-1px);
    box-shadow:0 7px 18px rgb(35 52 68 / .10);
  }

  .primary:hover{
    filter:brightness(.97);
  }

  .home-card:hover{
    transform:translateX(3px);
  }

  .chip:hover:not(.on),
  .choice-tabs button:hover:not(.on),
  .font-size-toggle:hover,
  .back-home:hover,
  details>summary:hover{
    background:var(--page-accent-soft);
    color:var(--page-accent);
  }
}

.primary:active,
.secondary:active,
.detail-toggle:active,
.chip:active,
.choice-tabs button:active,
.home-card:active,
.action-panel:active,
.insurance-step-link:active,
.broker-links a:active,
.font-size-toggle:active,
.back-home:active,
summary:active{
  transform:translateY(1px) scale(.995);
  box-shadow:none;
}

.home-card:active{
  background:linear-gradient(90deg,var(--page-accent-soft),transparent 78%);
}

/* Strong, consistent keyboard focus. */
a:focus-visible,
button:focus-visible,
input:focus-visible,
summary:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid color-mix(in srgb,var(--page-accent) 48%,transparent);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--paper);
}

/* Details and long-form reading. */
details>summary{
  border-radius:8px;
}

details[open]>summary{
  color:var(--page-accent);
}

.insurance-small-details>div,
.info-body{
  padding-bottom:18px;
}

.insurance-small-details p,
.info-body p{
  max-width:45rem;
}

.insurance-small-details p:first-child,
.info-body p:first-child{
  margin-top:2px;
}

.insurance-small-details p:last-child,
.info-body p:last-child{
  margin-bottom:0;
}

  padding-left:6px;
  padding-right:6px;
}

.bonus-list-content{
  padding-top:12px;
  padding-bottom:24px;
}

.story-hero p,
.visual-copy p,
.context-note,
.insurance-roadmap small,
.action-panel>small,
.insurance-small-details p,
.account-bottom p,
.construction-box p{
  max-width:46rem;
}

.action-panel,
.insurance-step-link,
.home-card,
.broker-links a{
  position:relative;
}

/* The normal-size home remains a strict no-scroll four-choice screen. */
html:not(.font-step-up) body.home,
html:not(.font-step-up) body.home .site{
  height:100dvh;
  min-height:0;
  overflow:hidden;
}

/* Large text may scroll vertically, but should never force horizontal scrolling. */
html.font-step-up body,
html.font-step-up .site,
html.font-step-up main,

function updateMobileCompare(){
  const key=mobileBand===20?20:"unlimited";
  const rows=mobileCompareData[mobilePriceMode][key];
  const titleBand=mobileBand===20?"20GBくらい":"100GB以上";
  const titleMode=mobilePriceMode==="normal"?"割引なし":"条件を全部そろえる";
  const head=document.getElementById("compareResultHead");
  const list=document.getElementById("compareList");
  if(head)head.textContent=`${titleBand}（${titleMode}）`;
  if(!list)return;
  list.innerHTML=rows.map((row,i)=>{
    const badge=i===0?'<span class="compare-badge">1位</span>':'';
    const crown='';
    return `<div class="compare-row${row.rakuten?' rakuten':''}">
      <div class="compare-rank">${i+1}</div>
      <div class="compare-main">
        <strong>${crown}${row.name}</strong>
        <small>${row.note}</small>
      </div>
      <div class="compare-price">${row.price}${badge}</div>
    </div>`;
  }).join("");

  const truth=document.getElementById("compareTruth");
  if(truth){
    if(mobilePriceMode==="normal"){
      truth.innerHTML=`<strong>割引なしなら、楽天が1位。</strong>`;
    }else if(mobileBand===20){
      truth.innerHTML=`<strong>1位はY!mobile。ただ、楽天との差は月110円。</strong><span>光回線と年会費11,000円のPayPayカード ゴールドまでそろえて、この差。</span>`;
    }else{
      truth.innerHTML=`<strong>家族・光・カード・電気・20年以上まで入れても、楽天が1位。</strong>`;
    }
  }
}

function renderYutai(){
  const currentMonth=new Date().getMonth()+1;
  const months=[...new Set(
    yutaiItems.flatMap(item=>
      [...item.month.matchAll(/(\d{1,2})月/g)].map(match=>Number(match[1]))
    )
  )].sort((a,b)=>{
    const da=(a-currentMonth+12)%12;
    const db=(b-currentMonth+12)%12;
    return da-db;
  });

  const nearestMonth=months[0];

  const list=yutaiItems
    .filter(item=>{
      if(selectedYutaiMonth==="all")return true;
      const itemMonths=[...item.month.matchAll(/(\d{1,2})月/g)].map(match=>Number(match[1]));
      if(selectedYutaiMonth==="near")return itemMonths.includes(nearestMonth);
      return itemMonths.includes(Number(selectedYutaiMonth));
    })
    .sort((a,b)=>a.money-b.money);

  app.innerHTML=`
    <section class="page">
      <section class="yutai-head">

          ${months.map(month=>monthChip(month,`${month}月`)).join("")}

      </section>

      <div class="yutai-list">
        ${list.map(yutaiCard).join("")}
      </div>

      <p class="notice">株価は動く。買う前に、その日の株価と会社のページを見る。</p>

      <section class="account-bottom broker-choice">

        <p>今使っている証券会社で1株から買えるなら、新しく口座を作る必要はない。</p>

        <div class="broker-links">
          <a href="${SBI_STOCK_URL}" target="_blank" rel="noopener noreferrer"><strong>SBI証券</strong><small>S株</small></a>
          <a href="${RAKUTEN_STOCK_URL}" target="_blank" rel="noopener noreferrer"><strong>楽天証券</strong><small>かぶミニ</small></a>
          <a href="${MONEX_STOCK_URL}" target="_blank" rel="noopener noreferrer"><strong>マネックス証券</strong><small>ワン株</small></a>
          <a href="${MOOMOO_STOCK_URL}" target="_blank" rel="noopener noreferrer"><strong>moomoo証券</strong><small>ひと株</small></a>
        </div>

        <small>どこも1株から買える。取扱銘柄や注文方法は会社ごとに違う。マネックスGの50ポイントは、マネックス証券で持つことが条件。</small>
      </section>

      <a class="back-link" href="#home">← 最初に戻る</a>
    </section>`;

  document.querySelectorAll("[data-yutai-month]").forEach(button=>{
    button.onclick=()=>{

function monthChip(value,label){
  return `<button class="chip ${String(selectedYutaiMonth)===String(value)?"on":""}" data-yutai-month="${value}">${label}</button>`;
}


function logoBlock(x){
  const label=x.logoText||x.name;
  if(!x.logo){
    return `<div class="company-logo text-logo"><span class="logo-fallback">${label}</span></div>`;
  }
  const extra=x.logoClass==="symbol"?" symbol":"";
  return `<div class="company-logo${extra}">
    <img src="${x.logo}" alt="" aria-hidden="true" loading="lazy" decoding="async" referrerpolicy="no-referrer"
      onerror="this.hidden=true;this.nextElementSibling.hidden=false;this.parentElement.classList.add('text-logo')">
    <span class="logo-fallback" hidden>${label}</span>
  </div>`;
}

function yutaiCard(x){
  const d=x.priceDate.split("-");
  const priceDate=`${Number(d[0])}/${Number(d[1])}/${Number(d[2])}`;
  const showCompanyName=x.logoClass==="symbol";
  return `<article class="yutai-card">
    <div class="yutai-top">
      <div class="company-id">
        ${logoBlock(x)}
        ${showCompanyName?`<h3>${x.name}</h3>`:""}
      </div>
      <span class="money">約${x.money.toLocaleString()}円<small>${priceDate}時点</small></span>

  const text=`【保険に入る前に見る4つ】

function go(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"})}

let lastModalFocus=null;
let toastTimer=null;

function openModal(title,text){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  lastModalFocus=document.activeElement instanceof HTMLElement ? document.activeElement : null;
  modal.hidden=false;
  requestAnimationFrame(()=>document.querySelector(".modal-box")?.focus({preventScroll:true}));
}

function closeModal(){
  if(modal.hidden)return;
  modal.hidden=true;
  if(lastModalFocus?.isConnected){
    lastModalFocus.focus({preventScroll:true});
  }
  lastModalFocus=null;
}

function showToast(text){
  clearTimeout(toastTimer);
  toast.textContent=text;
  toast.hidden=false;
  toastTimer=setTimeout(()=>toast.hidden=true,1700);
}

function focusRenderedPage(){
  const heading=app.querySelector("h1");
  if(!heading)return;
  heading.setAttribute("tabindex","-1");
  heading.focus({preventScroll:true});
}

const fontSizeToggle=document.getElementById("fontSizeToggle");

function syncFontSizeToggle(){
  if(!fontSizeToggle)return;
  const isLarge=document.documentElement.classList.contains("font-step-up");
  fontSizeToggle.setAttribute("aria-pressed",String(isLarge));
  const label=isLarge ? "文字を元の大きさに戻す" : "文字を一段階大きくする";
  fontSizeToggle.setAttribute("aria-label",label);
  fontSizeToggle.setAttribute("title",label);
  fontSizeToggle.textContent=isLarge ? "元に戻す" : "文字を大きく";
}

fontSizeToggle?.addEventListener("click",()=>{
  const isLarge=document.documentElement.classList.toggle("font-step-up");
  try{
    localStorage.setItem("icchy-font-size",isLarge?"large":"normal");
  }catch(error){}
  syncFontSizeToggle();
});

syncFontSizeToggle();

document.getElementById("modalClose").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};

document.addEventListener("keydown",event=>{
  if(modal.hidden)return;

  if(event.key==="Escape"){
    event.preventDefault();
    closeModal();
    return;
  }

  if(event.key!=="Tab")return;
  const focusable=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(element=>!element.hasAttribute("disabled") && element.getClientRects().length>0);
  if(!focusable.length){
    event.preventDefault();
    document.querySelector(".modal-box")?.focus();
    return;
  }

  const first=focusable[0];
  const last=focusable[focusable.length-1];
  if(event.shiftKey && document.activeElement===first){
    event.preventDefault();
    last.focus();
  }else if(!event.shiftKey && document.activeElement===last){
    event.preventDefault();
    first.focus();
  }
});
