<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="知らないまま、払いすぎない。スマホと保険。なんとなく払い続けるのをやめると、1年で20万円浮くことも。">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta property="og:locale" content="ja_JP">
<meta property="og:type" content="website">
<meta property="og:site_name" content="イッチー">
<meta property="og:title" content="イッチー｜知らないまま、払いすぎない">
<meta property="og:description" content="スマホと保険。なんとなく払い続けるのをやめると、1年で20万円浮くことも。">
<meta name="twitter:card" content="summary">
<title>イッチー｜知らないまま、払いすぎない</title>
<style>
:root{
  --ink:#141820;
  --muted:#5d6570;
  --line:#dfe3e8;
  --line-strong:#cdd5de;
  --paper:#f7f8fa;
  --mobile:#e83d70;
  --mobile-deep:#b82750;
  --mobile-soft:#fff4f7;
  --insurance:#008aa3;
  --insurance-soft:#effbfd;
  --side:clamp(16px,4.6vw,22px);
  --radius:16px;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

.header{
  height:60px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 max(var(--side),env(safe-area-inset-left));
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.brand{border:0;padding:0;background:transparent;font-size:17px;font-weight:850;letter-spacing:-.02em}
.header-actions{display:flex;align-items:center;gap:6px}
.font-toggle{
  min-height:42px;
  padding:0 12px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff;
  color:#343c46;
  font-size:13px;
  font-weight:750;
  transition:background-color .16s ease,border-color .16s ease,transform .12s ease;
}
.home-back{
  min-width:42px;
  min-height:42px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  font-size:20px;
}

.home{
  height:calc(100dvh - 60px);
  min-height:0;
  padding:16px var(--side) 12px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  overflow:hidden;
}
.intro h1{
  margin:0;
  max-width:11ch;
  font-size:clamp(38px,10.4vw,48px);
  line-height:1.04;
  letter-spacing:-.045em;
  font-weight:880;
  word-break:auto-phrase;
  text-wrap:balance;
}
.intro-promise{margin:11px 0 0;color:#343c45;font-size:15px;line-height:1.55}
.intro-promise strong{font-size:16px;color:var(--ink)}
.intro-promise b{font-weight:850;font-variant-numeric:tabular-nums}
.intro-note{margin:5px 0 0;color:#747d87;font-size:11px;line-height:1.45}

.choices{
  min-height:0;
  display:grid;
  grid-template-rows:minmax(0,1.18fr) minmax(0,.82fr);
  gap:11px;
  margin-top:13px;
}
.choice{
  min-height:0;
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:minmax(0,1fr) 38px;
  align-items:center;
  gap:12px;
  padding:18px 16px 18px 19px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:#fff;
  overflow:hidden;
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .18s ease,border-color .18s ease,background-color .18s ease;
}
.choice::before{content:"";position:absolute;z-index:-1;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.choice.mobile{--accent:var(--mobile);--soft:var(--mobile-soft);border-color:#f1c4d1;background:#fffafb;box-shadow:0 12px 34px rgba(131,33,65,.08)}
.choice.insurance{--accent:var(--insurance);--soft:var(--insurance-soft)}
.choice-label{display:block;color:var(--accent);font-size:13px;font-weight:820;letter-spacing:.01em}
.choice strong{
  display:block;
  margin-top:5px;
  font-size:clamp(27px,7.6vw,34px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:880;
  word-break:auto-phrase;
  text-wrap:balance;
}
.choice small{display:block;margin-top:8px;color:#46505b;font-size:14px;line-height:1.52}
.choice small b{color:var(--ink);font-weight:850}
.choice.mobile .mobile-promise{margin-top:12px;font-size:15px;line-height:1.18}
.metric-gb{display:inline-block;color:var(--mobile-deep);font-size:clamp(28px,8.5vw,38px);line-height:.95;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.metric-price{display:block;margin-top:4px;color:var(--mobile-deep);font-size:clamp(31px,9.1vw,41px);line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.mobile-outcome{display:block;margin-top:11px;color:#202630;font-size:clamp(18px,5vw,22px);font-weight:820;line-height:1.38;letter-spacing:-.02em}
.metric-wifi{color:var(--mobile-deep);font-size:1.09em;white-space:nowrap}
.arrow{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  justify-self:end;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  color:#414a54;
  font-size:25px;
  line-height:1;
  transition:transform .16s cubic-bezier(.16,1,.3,1),border-color .16s ease;
}
.choice:active{transform:translateY(1px) scale(.992);background:var(--soft)}
.choice:active .arrow{transform:translateX(2px)}

.detail{height:calc(100dvh - 60px);min-height:0;background:#fff;overflow:hidden}
.detail iframe{width:100%;height:100%;display:block;border:0;background:#fff}
a:focus-visible,button:focus-visible{outline:3px solid rgba(35,95,126,.38);outline-offset:3px}

html.large .home{overflow-y:auto}
html.large .intro h1{font-size:clamp(42px,11.5vw,54px)}
html.large .intro-promise{font-size:17px}
html.large .choice strong{font-size:clamp(31px,8.7vw,40px)}
html.large .choice small{font-size:16px}
html.large .mobile-outcome{font-size:clamp(20px,5.6vw,25px)}

@media(hover:hover) and (pointer:fine){
  .choice:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(35,52,68,.11);border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .choice:hover .arrow{transform:translateX(2px);border-color:var(--accent)}
  .font-toggle:hover,.home-back:hover{background:var(--paper);border-color:var(--line)}
}
@media(max-height:700px){
  .home{padding-top:9px;padding-bottom:8px}
  .intro h1{font-size:clamp(32px,9.3vw,40px)}
  .intro-promise{margin-top:6px;font-size:12.5px;line-height:1.4}
  .intro-promise strong{font-size:13.5px}
  .intro-note{margin-top:2px;font-size:9.5px}
  .choices{margin-top:8px;gap:7px}
  .choice{padding:11px 13px 11px 16px}
  .choice-label{font-size:11px}
  .choice strong{margin-top:2px;font-size:clamp(23px,6.8vw,29px)}
  .choice small{margin-top:4px;font-size:12px;line-height:1.32}
  .choice.mobile .mobile-promise{margin-top:5px;font-size:12px}
  .metric-gb{font-size:clamp(23px,7.4vw,29px)}
  .metric-price{display:inline-block;margin:0 0 0 4px;font-size:clamp(24px,7.6vw,31px)}
  .mobile-outcome{margin-top:5px;font-size:clamp(15px,4.4vw,18px);line-height:1.28}
  .arrow{width:32px;height:32px}
}
@media(max-width:340px){
  :root{--side:14px}
  .font-toggle{padding:0 9px;font-size:12px}
  .choice{padding-left:16px;padding-right:12px}
  .intro-promise{font-size:13.5px}
  .choice.mobile .mobile-promise{font-size:14px}
}
@media(min-width:720px){
  :root{--side:24px}
  .home{width:min(720px,100%);margin:0 auto}
}
@media(min-width:900px){
  .home{
    width:min(1040px,100%);
    padding-top:28px;
    padding-bottom:28px;
    grid-template-columns:minmax(300px,.82fr) minmax(480px,1.18fr);
    grid-template-rows:minmax(0,1fr);
    gap:64px;
    align-items:stretch;
  }
  .intro{align-self:start;padding-top:18px}
  .intro h1{font-size:56px}
  .intro-promise{margin-top:18px;font-size:16px}
  .intro-promise strong{font-size:17px}
  .intro-note{font-size:11.5px}
  .choices{margin-top:0;gap:14px}
  .choice{padding:24px 24px 24px 28px}
  .choice strong{font-size:36px}
  .choice.mobile .mobile-promise{font-size:16px}
  .metric-gb{font-size:42px}
  .metric-price{font-size:45px}
  .mobile-outcome{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="header">
  <button class="brand" id="brandHome" type="button">イッチー</button>
  <div class="header-actions">
    <button class="font-toggle" id="fontToggle" type="button" aria-pressed="false">文字を大きく</button>
    <button class="home-back" id="homeBack" type="button" aria-label="最初に戻る" hidden>⌂</button>
  </div>
</header>
<main class="home" id="homeView">
  <section class="intro">
    <h1>知らないまま、<br>払いすぎない。</h1>
    <p class="intro-promise"><strong>スマホと保険。</strong><br>なんとなく払い続けるのをやめると、<br><b>1年で20万円浮くことも。</b> <b>50年なら、1,000万円。</b></p>
    <p class="intro-note">※年間20万円の差が50年間続いた場合の単純計算。</p>
  </section>
  <nav class="choices" aria-label="見る内容を選ぶ">
    <a class="choice mobile" href="#mobile">
      <span><span class="choice-label">スマホ代</span><strong>楽天モバイル</strong><small><b class="mobile-promise"><span class="metric-gb">100GB</span>使っても、月<span class="metric-price">3,168円。</span></b><span class="mobile-outcome">テザリングで、俺は家の<span class="metric-wifi">Wi-Fi代も0円</span>になった。</span></small></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="choice insurance" href="#insurance">
      <span><span class="choice-label">固定費</span><strong>保険</strong><small>払いすぎる前に、<br>国・会社の保障から見る。</small></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </nav>
</main>
<section class="detail" id="detailView" hidden aria-label="詳細"><iframe id="detailFrame" title="イッチー 詳細ページ"></iframe></section>
<script>
const KNOWN_ROUTES=new Set(['mobile','mobile-100gb','yutai','insurance','insurance-compare','deals']);
const homeView=document.getElementById('homeView'),detailView=document.getElementById('detailView'),detailFrame=document.getElementById('detailFrame'),brandHome=document.getElementById('brandHome'),homeBack=document.getElementById('homeBack'),fontToggle=document.getElementById('fontToggle');
function currentRoute(){const route=location.hash.slice(1);return KNOWN_ROUTES.has(route)?route:'home'}
function goHome(){if(location.hash==='#home'||!location.hash){history.replaceState(null,'',location.pathname+location.search+'#home');renderRoute()}else location.hash='home'}
function applyFontSize(){let large=false;try{large=localStorage.getItem('icchy-font-size')==='large'}catch(e){}document.documentElement.classList.toggle('large',large);fontToggle.setAttribute('aria-pressed',String(large));fontToggle.textContent=large?'元に戻す':'文字を大きく';try{detailFrame.contentDocument?.documentElement.classList.toggle('font-step-up',large)}catch(e){}}
function renderRoute(){const route=currentRoute(),isHome=route==='home';homeView.hidden=!isHome;detailView.hidden=isHome;homeBack.hidden=isHome;document.body.style.overflow='hidden';if(isHome){document.title='イッチー｜知らないまま、払いすぎない';return}const target=route==='mobile'?'mobile.html':`app.html#${route}`;if(detailFrame.dataset.target!==target){detailFrame.dataset.target=target;detailFrame.dataset.route=route;detailFrame.src=target}document.title=route.startsWith('insurance')?'保険｜イッチー':'楽天モバイル｜イッチー'}
function enhanceFrame(){try{const win=detailFrame.contentWindow,doc=detailFrame.contentDocument;if(!win||!doc)return;const innerHeader=doc.querySelector('.header');if(innerHeader)innerHeader.style.display='none';const innerSite=doc.querySelector('.site');if(innerSite){innerSite.style.boxShadow='none';innerSite.style.margin='0 auto'}const large=document.documentElement.classList.contains('large');doc.documentElement.classList.toggle('font-step-up',large);if(!doc.documentElement.dataset.launcherBound){doc.documentElement.dataset.launcherBound='1';doc.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href')||'';if(href==='#home'){e.preventDefault();goHome();return}if(href.startsWith('./insurance-consultation')){e.preventDefault();window.location.href='insurance-consultation/'}},true);win.addEventListener('hashchange',()=>{if(!win.location.pathname.endsWith('/app.html'))return;const route=win.location.hash.slice(1);if(KNOWN_ROUTES.has(route)){detailFrame.dataset.route=route;history.replaceState(null,'',location.pathname+location.search+`#${route}`)}})}}catch(e){}}
brandHome.addEventListener('click',goHome);homeBack.addEventListener('click',goHome);fontToggle.addEventListener('click',()=>{const next=!document.documentElement.classList.contains('large');try{localStorage.setItem('icchy-font-size',next?'large':'normal')}catch(e){}applyFontSize()});detailFrame.addEventListener('load',enhanceFrame);window.addEventListener('hashchange',renderRoute);applyFontSize();renderRoute();
</script>
</body>
</html>
